name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest # Spustí na najnovšom Ubuntu

    steps:
      # Krok 1: Checkout kódu z repozitára
      - name: Checkout code
        uses: actions/checkout@v2 # Akcia, ktorá stiahne kód z GitHub repozitára

      # Krok 2: Nastavenie Node.js prostredia
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14" # Určujeme verziu Node.js (môžete upraviť podľa potreby)

      # Krok 3: Nainštalovanie závislostí
      - name: Install dependencies
        run: npm install # Inštaluje závislosti definované v package.json

      # Krok 4: Spustenie testov
      - name: Run tests
        run: npm test # Spustí testy, ktoré máte nastavené v projekte
